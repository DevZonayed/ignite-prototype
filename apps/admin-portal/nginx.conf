server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Views are hash routes (#users, #curriculum, …), so the server only ever
    # sees "/" — the try_files fallback is here for deep links anyway.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Written at container start by 10-runtime-config.sh. Never cache it, or a
    # browser will keep pointing at the previous deployment's API.
    location = /runtime-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # Vite emits content-hashed asset filenames, so these are safe to pin.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
